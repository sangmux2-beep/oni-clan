<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="data:,">
<title>ONI 클랜 · 배그 지도 & 전적</title>
<style>
:root{--bg:#0f1115;--panel:#181b22;--line:#2a2f3a;--txt:#eef1f6;--sub:#9aa3b2;--acc:#ffb020;--ok:#3ddc84;--bad:#ff5a5a;--cy:#3fd5ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;gap:6px;padding:6px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;color:var(--sub);font-size:15px;font-weight:700;padding:9px 11px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--acc);color:#111}
#mode button.on[data-v=route]{background:var(--cy);color:#111}
#poi button.on{background:#3a4152;color:#fff}
#phases{display:flex;gap:4px;padding:6px;overflow-x:auto;border-bottom:1px solid var(--line)}
#phases button{flex:1 0 auto;min-width:40px;background:var(--panel);border:1px solid var(--line);color:var(--txt);font-size:16px;font-weight:800;padding:8px 6px;border-radius:9px;cursor:pointer}
#phases button.on{background:var(--acc);color:#111;border-color:var(--acc)}
main{flex:1;display:flex;min-height:0}
#wrap{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;background:#000}
canvas{display:block;touch-action:none;cursor:crosshair}
#hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);padding:6px 12px;border-radius:20px;font-size:14px;font-weight:700;pointer-events:none;white-space:nowrap}
#tools{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
#tools button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:rgba(24,27,34,.92);color:var(--txt);font-size:20px;cursor:pointer}
aside{width:340px;background:var(--panel);border-left:1px solid var(--line);padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.big{font-size:20px;font-weight:900;line-height:1.3}
.card{background:#11141a;border:1px solid var(--line);border-radius:12px;padding:10px}
.card h3{font-size:13px;color:var(--sub);margin-bottom:6px;font-weight:700}
.row{display:flex;justify-content:space-between;gap:8px;font-size:15px;font-weight:700;padding:3px 0}
.pct{color:var(--acc)}.g{color:var(--ok)}.r{color:var(--bad)}.c{color:var(--cy)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0 6px}
.tag{font-size:13px;font-weight:700;padding:3px 7px;border-radius:7px;background:#232835}
table{width:100%;border-collapse:collapse;font-size:14px;font-weight:700}
td,th{padding:4px 2px;text-align:right}th{color:var(--sub);font-size:12px;font-weight:700}td:first-child,th:first-child{text-align:left}
tr.me td{color:var(--acc)}
.legend{font-size:12px;color:var(--sub);line-height:1.6}
.advice{font-size:15px;font-weight:800;line-height:1.45;margin-bottom:6px}
@media (max-aspect-ratio:1/1){main{flex-direction:column}aside{width:auto;border-left:0;border-top:1px solid var(--line);max-height:42vh;padding:8px}.big{font-size:18px}}
#pop{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:9;flex-direction:column;gap:10px;padding:16px}
#pop img{width:min(92vw,78vh,560px);border-radius:12px;border:2px solid #555}
#pop div{font-size:15px;font-weight:800;text-align:center;line-height:1.5}
#poi button{display:flex;align-items:center;gap:4px;padding:7px 9px}
.bd{display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;font-style:normal;font-size:11px;border:2px solid #fff;box-shadow:0 0 0 1px #000}
.bd.sq{border-radius:5px}
#poi button:not(.on){opacity:.4}
#phases,#hint{display:none!important}
#ctab{overflow-x:auto}#ctab table{font-size:14px}#ctab td,#ctab th{padding:7px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
#ctab tr.top td{background:rgba(255,176,32,.08)}#ctab .nm{font-weight:900}#ctab .sub{font-size:11px;color:var(--sub);font-weight:600}
.tier{display:inline-block;padding:2px 6px;border-radius:6px;font-size:12px;font-weight:900;color:#111}
#ctab th{cursor:pointer;position:sticky;top:0;background:var(--bg)}
#ctab tr[data-i]{cursor:pointer}
#pp{position:fixed;inset:0;background:var(--bg);display:none;z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch}
#pp .box{max-width:640px;margin:0 auto;padding:0 12px}
.pfbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 0;background:rgba(15,17,21,.94);backdrop-filter:blur(6px)}
.pfbar .x{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:#fff;font-size:20px;cursor:pointer}
.pfbar b{font-size:17px}
.hero{display:flex;gap:14px;align-items:center;padding:18px 16px;border-radius:18px;margin:4px 0 12px;border:1px solid color-mix(in srgb,var(--tc) 45%,transparent);background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--tc) 38%,transparent),transparent 60%),#141821}
.av{width:64px;height:64px;flex:0 0 auto;border-radius:20px;display:grid;place-items:center;font-size:28px;font-weight:900;color:#111;background:linear-gradient(135deg,#ffd27a,var(--acc))}
.pfimg{width:84px;height:84px;flex:0 0 auto;border-radius:22px;background:radial-gradient(circle at 50% 40%,#1d3a63,#0b0f17 75%);border:2px solid color-mix(in srgb,var(--tc) 70%,#3fa9ff);box-shadow:0 0 18px rgba(63,169,255,.35);display:grid;place-items:center;overflow:hidden}.pfimg img{width:96%;height:96%;object-fit:contain}
.av.s{width:38px;height:38px;border-radius:12px;font-size:17px}
.hn{font-size:26px;font-weight:900;line-height:1.1}.hs{font-size:13px;color:var(--sub);font-weight:600;margin-top:3px}
.ht{display:flex;align-items:baseline;gap:6px;margin-top:8px}.ht b{font-size:24px;font-weight:900;color:var(--acc)}.ht small{color:var(--sub);font-weight:700}
.tier{display:inline-block;padding:3px 8px;border-radius:7px;color:#111;font-weight:900;font-size:13px}
#pp section{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.st{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}.st>span{font-weight:900;font-size:16px}.st small{color:var(--sub);font-size:12px;font-weight:600}
.seg.sm button{font-size:13px;padding:6px 9px}
.bigs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bg{background:#11141a;border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.bg b{display:block;font-size:21px;font-weight:900}.bg span{font-size:11px;color:var(--sub);font-weight:700}.bg i{display:block;font-style:normal;font-size:10px;color:var(--sub);margin-top:2px}.bg em{font-style:normal;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}.grid div{background:#11141a;border:1px solid var(--line);border-radius:10px;padding:7px;text-align:center}
.grid b{display:block;font-size:16px}.grid span{font-size:11px;color:var(--sub);font-weight:700}
.empty{color:var(--sub);font-size:13px;padding:10px;text-align:center}
.spark{display:flex;align-items:flex-end;gap:3px;height:96px;margin-top:12px;padding:0 2px;border-bottom:1px solid var(--line)}
.spark div{flex:1;background:#3a4252;border-radius:4px 4px 0 0;position:relative;min-width:0}.spark div.t10{background:var(--ok)}.spark div.chk{background:var(--acc)}
.spark span{position:absolute;top:-15px;left:0;right:0;text-align:center;font-size:9px;color:var(--sub);font-weight:700}
.lg2{font-size:11px;color:var(--sub);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.lg2 i{display:inline-block;width:9px;height:9px;border-radius:2px;background:#3a4252;margin-right:3px}.lg2 i.t10{background:var(--ok)}.lg2 i.chk{background:var(--acc)}
.bud{display:flex;gap:10px;align-items:center;padding:8px 4px;border-top:1px solid var(--line);cursor:pointer}.bud:first-of-type{border-top:0}
.bb{height:6px;background:#11141a;border-radius:3px;margin:5px 0 3px;overflow:hidden}.bb i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#ffd27a);border-radius:3px}
.bs{font-size:12px;color:var(--sub);font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.mt{width:100%;font-size:13px;border-collapse:collapse}.mt td,.mt th{padding:6px 3px;border-top:1px solid var(--line)}
.mm{display:flex;gap:10px;align-items:center;padding:9px 8px;margin-top:6px;border-radius:12px;background:#11141a;border:1px solid var(--line);border-left:5px solid #3a4252;cursor:pointer}
.mm.t10{border-left-color:var(--ok)}.mm.win{border-left-color:var(--cy)}.mm.win .mr b{color:var(--cy)}.mm.chk{border-left-color:var(--acc);background:linear-gradient(90deg,rgba(255,176,32,.13),#11141a 60%)}
.mr{width:46px;text-align:center;flex:0 0 auto}.mr b{font-size:19px;font-weight:900}.mm.t10 .mr b{color:var(--ok)}.mm.chk .mr b{color:var(--acc)}.mr small{display:block;font-size:10px;color:var(--sub)}
.mk{font-size:12px;color:var(--sub)}.mk b{color:var(--txt);font-size:15px}
.md:not(:empty){background:#0b0d11;border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;margin-top:-6px;padding:10px 8px 8px;overflow-x:auto}
.tt{width:100%;font-size:12px;border-collapse:collapse;white-space:nowrap}.tt td,.tt th{padding:5px 4px}.tt tr.me td{color:var(--acc);font-weight:800}.tt a{color:var(--cy);font-weight:800;cursor:pointer;text-decoration:underline}
@media(max-width:380px){.bg b{font-size:17px}.hn{font-size:22px}}
</style>

<body>
<div id="brand" style="display:flex;align-items:center;gap:10px;padding:10px 12px 4px"><div style="width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#ff3b3b,#8a0f0f);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#fff;box-shadow:0 0 0 2px #fff2">鬼</div><div><div style="font-size:18px;font-weight:900;letter-spacing:.5px">ONI CLAN</div><div style="font-size:12px;color:var(--sub);font-weight:700">카카오 배그 · 지도 & 클랜 전적</div></div></div>
<div id="tabs" class="seg" style="margin:6px 6px 0"><button data-v="map" class="on">🗺️ 지도</button><button data-v="clan">📊 클랜 전적</button></div>
<header>
  <div class="seg" id="maps">
    <button data-v="erangel" class="on">에란겔</button><button data-v="miramar">미라마</button><button data-v="taego">태이고</button><button data-v="rondo">론도</button><button data-v="vikendi">비켄디</button>
  </div>

  <div class="seg" id="poi"><button data-v="fixed" class="on"><i class="bd" style="background:#2f7bff">🚙</i>고차</button><button data-v="garage" class="on"><i class="bd sq" style="background:#ffc400">🚗</i>차고</button><button data-v="boat" class="on"><i class="bd" style="background:#00b8d4">🚤</i>보트</button><button data-v="glider" class="on"><i class="bd" style="background:#22a95b">✈</i>글라</button><button data-v="key" class="on"><i class="bd" style="background:#8a3ffc">🔑</i>비방</button></div>
</header>
<div id="phases"></div>
<section id="clan" style="display:none;flex:1;overflow:auto;padding:8px">
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
    <div class="seg" id="cf"><button data-v="0" class="on">전체</button><button data-v="1">1클랜</button><button data-v="2">2클랜</button></div>
    <div class="seg" id="cm"><button data-v="rk" class="on">🏆 경쟁전</button><button data-v="nm">🎮 일반전</button></div>
  </div>
  <div class="seg" id="cs" style="margin-bottom:8px;flex-wrap:wrap"></div>
  <div id="lock" class="card" style="display:none;margin-bottom:8px"><div class="row"><span>🔒 클랜원 별명 보기</span></div>
    <form id="lockf" style="display:flex;gap:6px;margin-top:6px"><input id="pw" type="password" placeholder="클랜 비밀번호" style="flex:1;min-width:0;padding:9px;border-radius:8px;border:1px solid var(--line);background:#0b0d11;color:var(--txt);font-size:15px"><button style="padding:9px 14px;border-radius:8px;border:0;background:var(--acc);font-weight:900">확인</button></form>
    <div id="lockmsg" class="legend"></div></div>
  <div id="ctab"></div>
  <div class="legend" id="cnote" style="margin-top:8px"></div>
</section>
<main>
  <div id="wrap"><canvas id="cv"></canvas><div id="hint"></div>
    <div id="tools"><button id="zoom" title="확대/전체">🔍</button><button id="reset" title="지우기">↺</button></div>
  </div>
  <aside id="info"></aside>
</main>
<div id="pop"><img alt=""><div></div></div>
<div id="pp"><div class="box" id="ppb"></div></div>
<script>
const SIZE=8160,MAPS=['erangel','miramar','taego','rondo','vikendi'],NM={erangel:'에란겔',miramar:'미라마',taego:'태이고',rondo:'론도',vikendi:'비켄디'};
const DIRS=['동','남동','남','남서','서','북서','북','북동'],PGRP=[0,1,2,3,4,5,5,5,5];
const S={map:'erangel',mode:'perf',src:'all',show:{fixed:true,garage:true,boat:true,glider:true,key:true},phase:0,centers:{},me:{},plane:[],data:{},img:{},common:null};
S.C=()=>S.centers[S.phase]||null;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id),DPR=()=>window.devicePixelRatio||1;

async function loadMap(m){
  if(!S.data[m])S.data[m]=await fetch('data/'+m+'.json').then(r=>r.json());
  if(!S.img[m]){S.img[m]=await new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.src='maps/'+m+'.jpg'});
    const hi=new Image();hi.onload=()=>{S.img[m]=hi;if(S.map===m)draw()};hi.src='maps/'+m+'_hi.jpg'}
  prep(S.data[m]);
}
// ---------- grids ----------
function blurGrid(sparse,G,sigma){
  const a=new Float32Array(G*G);sparse.forEach(([i,j,v])=>a[j*G+i]+=v);
  const r=Math.ceil(sigma*2.5),k=[];let ks=0;for(let d=-r;d<=r;d++){const w=Math.exp(-d*d/(2*sigma*sigma));k.push(w);ks+=w}
  const t=new Float32Array(G*G),o=new Float32Array(G*G);
  for(let j=0;j<G;j++)for(let i=0;i<G;i++){let s=0;for(let d=-r;d<=r;d++){const ii=i+d;if(ii>=0&&ii<G)s+=a[j*G+ii]*k[d+r]}t[j*G+i]=s/ks}
  for(let j=0;j<G;j++)for(let i=0;i<G;i++){let s=0;for(let d=-r;d<=r;d++){const jj=j+d;if(jj>=0&&jj<G)s+=t[jj*G+i]*k[d+r]}o[j*G+i]=s/ks}
  return o;
}
function prep(D){
  if(D._p)return;D._p=1;
  D._pri0=blurGrid(D.prior[0]||[],D.PG,1.3);
  const BG=D.BG||256;D._bg=BG;D._bld=new Float32Array(BG*BG);(D.bld||[]).forEach(([i,j,d,it])=>D._bld[j*BG+i]=d+it*0.3);
  const vals=(D.bld||[]).map(([i,j,d,it])=>d+it*0.3).sort((a,b)=>a-b);D._bq=vals[Math.floor(vals.length*0.75)]||1;
  const EG=D.EG||192;D._eg=new Float32Array(EG*EG).fill(NaN);(D.elev||[]).forEach(([i,j,z])=>D._eg[j*EG+i]=z);
  const FG=D.FG||96;D._perf=[];D._dth=[];
  for(let g=0;g<6;g++){const n=new Float32Array(FG*FG),a=new Float32Array(FG*FG),t=new Float32Array(FG*FG);
    ((D.perf&&D.perf[g])||[]).forEach(([i,j,nn,aa,tt])=>{n[j*FG+i]=nn;a[j*FG+i]=aa;t[j*FG+i]=tt});
    const box=src=>{const o=new Float32Array(FG*FG);for(let j=0;j<FG;j++)for(let i=0;i<FG;i++){let s=0;for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){const ii=i+di,jj=j+dj;if(ii>=0&&jj>=0&&ii<FG&&jj<FG)s+=src[jj*FG+ii]}o[j*FG+i]=s}return o};
    D._perf[g]={n:box(n),a:box(a),t:box(t)};
    const dd=blurGrid((D.dth&&D.dth[g])||[],FG,1),pn=blurGrid(((D.perf&&D.perf[g])||[]).map(([i,j,nn])=>[i,j,nn]),FG,1),dg=new Float32Array(FG*FG);
    for(let q=0;q<FG*FG;q++)dg[q]=dd[q]/(pn[q]+3);
    const dv=[...dg].filter(v=>v>0).sort((x,y)=>x-y);D._dth[g]={g:dg,q:dv[Math.floor(dv.length*0.8)]||1}}
  // water grid on FG: no height samples and no buildings nearby
  D._water=new Uint8Array(FG*FG);
  for(let j=0;j<FG;j++)for(let i=0;i<FG;i++){const x=(i+.5)*SIZE/FG,y=(j+.5)*SIZE/FG;D._water[j*FG+i]=isLand(D,x,y)?0:1}
}
const ij=(G,x,y)=>[Math.floor(x/SIZE*G),Math.floor(y/SIZE*G)];
function bldAt(D,x,y){const G=D._bg,[i,j]=ij(G,x,y);let m=0;for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){const ii=i+di,jj=j+dj;if(ii>=0&&jj>=0&&ii<G&&jj<G)m=Math.max(m,D._bld[jj*G+ii])}return m/D._bq}
function relElev(D,x,y){
  const G=D.EG||192,[i,j]=ij(G,x,y);if(i<0||j<0||i>=G||j>=G)return null;
  let z=D._eg[j*G+i];if(isNaN(z)){let s=0,n=0;for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){const v=D._eg[(j+dj)*G+i+di];if(v===v&&v!==undefined){s+=v;n++}}if(!n)return null;z=s/n}
  let s=0,n=0;for(let dj=-5;dj<=5;dj++)for(let di=-5;di<=5;di++){if(Math.abs(di)<3&&Math.abs(dj)<3)continue;const ii=i+di,jj=j+dj;if(ii<0||jj<0||ii>=G||jj>=G)continue;const v=D._eg[jj*G+ii];if(!isNaN(v)){s+=v;n++}}
  return n>=6?z-s/n:null;
}
function isLand(D,x,y){const G=D.EG||192,[i,j]=ij(G,x,y);for(let dj=-2;dj<=2;dj++)for(let di=-2;di<=2;di++){const ii=i+di,jj=j+dj;if(ii<0||jj<0||ii>=G||jj>=G)continue;if(!isNaN(D._eg[jj*G+ii]))return true}return bldAt(D,x,y)>0.1}
function distLine(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;return Math.abs((p[0]-a[0])*dy-(p[1]-a[1])*dx)/L}
function dirName(dx,dy){if(Math.hypot(dx,dy)<1)return '중앙';return DIRS[(Math.round(Math.atan2(dy,dx)/(Math.PI/4))+8)%8]}
function terrainTags(D,x,y){const t=[],b=bldAt(D,x,y),h=relElev(D,x,y);
  t.push(b>=1?'🏠 건물 바로 옆':b>=0.3?'🏚️ 작은 건물 근처':'🌲 건물 없음');
  if(h!=null)t.push(h>=6?`⛰️ 주변보다 ${Math.round(h)}m 높음`:h<=-6?`⬇️ 주변보다 ${Math.round(-h)}m 낮음`:'➖ 평지');
  return t}

// ---------- landing by flight path ----------
async function loadLand(m){const D=S.data[m];if(!D._land)D._land=await fetch('data/'+m+'_land.json').then(r=>r.json()).catch(()=>null);return D._land}
function landing(){
  const D=S.data[S.map],L=D._land;if(!L||S.plane.length<2)return null;
  const[a,b]=S.plane,ang=((Math.atan2(b[1]-a[1],b[0]-a[0])%Math.PI)+Math.PI)%Math.PI,n=[-Math.sin(ang),Math.cos(ang)];
  const mid=[(a[0]+b[0])/2-SIZE/2,(a[1]+b[1])/2-SIZE/2],off=mid[0]*n[0]+mid[1]*n[1];

function spotPerf(){
  const D=S.data[S.map],k=S.phase-1,c=S.C();if(k<0||!c)return null;
  const R=S.common.radii[k],G=D.FG,P=D._perf[PGRP[k]],cells=[];let N=0,T=0;
  const [i0,j0]=ij(G,c[0]-R,c[1]-R),[i1,j1]=ij(G,c[0]+R,c[1]+R);
  for(let j=Math.max(0,j0);j<=Math.min(G-1,j1);j++)for(let i=Math.max(0,i0);i<=Math.min(G-1,i1);i++){
    const x=(i+.5)*SIZE/G,y=(j+.5)*SIZE/G;if(Math.hypot(x-c[0],y-c[1])>R)continue;
    const n=P.n[j*G+i],t=P.t[j*G+i],a=P.a[j*G+i];N+=n;T+=t;cells.push({x,y,n,t,a})}

  const good=cells.filter(o=>o.n>=60&&!D._water[ij(G,o.x,o.y)[1]*G+ij(G,o.x,o.y)[0]]).sort((a,b)=>b.rate-a.rate),top=[],sep=Math.max(120,R/3);

// ---------- 2) entry route (Dijkstra on 96 grid, cost = distance × (1 + danger) + water) ----------

function stratCard(k){

const ptrs=new Map();let drag=null,pinch=null;
function sxy(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*DPR(),(e.clientY-r.top)*DPR()]}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,sxy(e));
  if(ptrs.size===1)drag={start:sxy(e),last:sxy(e),moved:false};
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1])};drag=null}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const p=sxy(e);ptrs.set(e.pointerId,p);
  if(pinch&&ptrs.size===2){const[a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);zoomAt((a[0]+b[0])/2,(a[1]+b[1])/2,d/pinch.d);pinch.d=d;return}
  if(drag){if(Math.hypot(p[0]-drag.start[0],p[1]-drag.start[1])>10*DPR())drag.moved=true;
    if(drag.moved){view.x-=(p[0]-drag.last[0])/px/view.s;view.y-=(p[1]-drag.last[1])/px/view.s;clampView();draw()}drag.last=p}});
function up(e){const had=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  if(ptrs.size===0)drag=null}

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const E=C.enc||(C.enc=await fetch('data/names.enc.json').then(r=>r.json()));
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(E.salt),iterations:E.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(E.iv)},key,b64(E.ct));
  C.names=JSON.parse(new TextDecoder().decode(pt));try{localStorage.setItem('oniPw',pw)}catch(e){}
}

  let rows=D.rows.filter(r=>!C.f||r.c===C.f);
  const has=rows.filter(r=>r[C.m]),none=rows.filter(r=>!r[C.m]);
  const asc=C.sort==='avgRank';has.sort((a,b)=>asc?a[C.m][C.sort]-b[C.m][C.sort]:b[C.m][C.sort]-a[C.m][C.sort]);
  let h=`<table><tr><th>#</th><th style="text-align:left">닉네임</th>${C.m==='rk'?'<th>티어</th>':''}${cols.map(([k,l])=>`<th>${l}</th>`).join('')}</tr>`;
  C.shown=has;has.forEach((r,i)=>{const s=r[C.m];h+=`<tr data-i="${i}" class="${i<3?'top':''}"><td>${i<3?['🥇','🥈','🥉'][i]:i+1}</td><td style="text-align:left"><div class="nm">${nick(r)||r.n}</div><div class="sub">${nick(r)?r.n+' · ':''}${r.c}클</div></td>
    ${C.m==='rk'?`<td><span class="tier" style="background:${TC[s.tierEn]||'#888'}">${s.tier}</span></td>`:''}
    ${cols.map(([k])=>`<td class="${k===C.sort?'pct':''}">${k==='rp'?s[k].toLocaleString():s[k]}${['win','top10','hs'].includes(k)?'%':''}</td>`).join('')}</tr>`});
  h+='</table>';$('ctab').innerHTML=h;$('ctab').querySelectorAll('tr[data-i]').forEach(tr=>tr.onclick=()=>showP(C.shown[+tr.dataset.i]));
  $('cnote').innerHTML=`시즌 ${D.season} · ${D.updated} 기준 · 카카오 서버 공식 API<br>${C.m==='rk'?'경쟁전 스쿼드':'일반전 스쿼드 (3인칭·1인칭 중 많이 한 쪽)'} 기록 있는 ${has.length}명 표시`+
    (none.length?` · 이번 시즌 기록 없음 ${none.length}명: ${none.map(r=>(nick(r)||r.n)+(r.ok?'':'(닉네임 못 찾음)')).join(', ')}`:'');
}
$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('tabs').querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  const clan=b.dataset.v==='clan';document.querySelector('header').style.display=clan?'none':'';document.querySelector('main').style.display=clan?'none':'flex';
  $('clan').style.display=clan?'block':'none';if(clan)loadClan();else fit()});
$('cf').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('cf').querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');C.f=+b.dataset.v;renderClan()});
$('cm').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('cm').querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');C.m=b.dataset.v;renderClan()});
</script>
</body>
</html>
