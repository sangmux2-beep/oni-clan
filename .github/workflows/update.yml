name: 클랜 전적 갱신
on:
  schedule:
    - cron: '7 */3 * * *'   # 3시간마다
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: clan-update, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tools/update_clan.py
        env: { PUBG_API_KEY: '${{ secrets.PUBG_API_KEY }}' }
      - run: python tools/update_matches.py
        env: { PUBG_API_KEY: '${{ secrets.PUBG_API_KEY }}' }
      - run: |
          git config user.name "oni-clan-bot"
          git config user.email "oni-clan-bot@users.noreply.github.com"
          git add data/clan.json data/matches.json
          git diff --cached --quiet || (git commit -m "전적 자동 갱신" && git pull --rebase && git push)
